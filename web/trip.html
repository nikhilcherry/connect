<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live trip · Connect</title>
<meta name="description" content="Follow a Connect driver's trip live.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEEDF8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23171335'/><path d='M27 37l10-10M24 31l-3 3a6 6 0 0 0 8.5 8.5l3-3M40 33l3-3a6 6 0 0 0-8.5-8.5l-3 3' stroke='white' stroke-width='4' fill='none' stroke-linecap='square'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Dispatch Periwinkle, same tokens as the app (app/lib/theme.dart) and the scan page. */
  :root {
    --ground: #EEEDF8; --card: #FFFFFF; --line: #DAD7EC; --line-strong: #CBC7E2;
    --ink: #171335; --muted: #575279; --on-dark: #FFFFFF; --on-dark-muted: #C4BFDE;
    --violet: #5A45C9; --violet-deep: #3C2C93; --violet-tint: #E2DEF7;
    --success: #16775B; --success-tint: #E2F1EC;
    --ease: cubic-bezier(0.2, 0, 0, 1);
    --display: "Space Grotesk", system-ui, sans-serif;
    --ui: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.65 var(--ui); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 17px/1 var(--display); letter-spacing: -0.01em; }
  .brand svg { width: 32px; height: 32px; }
  .lang { min-height: 44px; border: 1px solid var(--line); background: var(--card); color: var(--violet); border-radius: 10px; padding: 0 34px 0 14px; font: 600 15px var(--ui); cursor: pointer; appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235A45C9' stroke-width='2' stroke-linecap='square'><path d='M7 10l5 5 5-5'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; background-size: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 12px; }
  .label { font: 600 11px/1 var(--ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  h1 { font: 700 26px/1.15 var(--display); letter-spacing: -0.02em; margin: 0 0 4px; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; line-height: 1.4; }
  .status { display: flex; align-items: center; gap: 10px; font: 600 17px/1.3 var(--ui); margin-top: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--violet); flex: none; animation: pulse 1.6s ease-in-out infinite; }
  .dot.stale { background: var(--muted); animation: none; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .sketch { position: relative; background: var(--ground); border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; margin-top: 16px; }
  .sketch svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sketch .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }
  .route { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .start { fill: var(--card); stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .here { fill: var(--violet); }
  .ring { fill: none; stroke: var(--violet); stroke-width: 2; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; animation: ring 2.4s var(--ease) infinite; }
  @keyframes ring { from { transform: scale(0.6); opacity: 0.8; } to { transform: scale(2.6); opacity: 0; } }
  .figures { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .figure { font: 700 30px/1 var(--display); letter-spacing: -0.01em; }
  .figure small { font: 400 13px var(--ui); color: var(--muted); margin-left: 4px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; border: 0; border-radius: 10px; padding: 16px 28px; font: 700 15px/1.2 var(--ui); cursor: pointer; background: var(--violet); color: var(--on-dark); margin-top: 20px; text-decoration: none; transition: background-color 140ms var(--ease), transform 140ms var(--ease); }
  .btn:active { background: var(--violet-deep); transform: scale(0.98); }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; }
  a:focus-visible, .lang:focus-visible { outline: 1px solid var(--violet); box-shadow: 0 0 0 3px var(--violet-tint); }
  .done { display: grid; place-items: center; text-align: center; padding: 32px 20px; }
  .check { width: 56px; height: 56px; border-radius: 10px; background: var(--success-tint); display: grid; place-items: center; margin-bottom: 16px; }
  .check path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw 520ms var(--ease) 80ms forwards; }
  footer { text-align: center; margin-top: 28px; font-size: 13px; line-height: 1.6; color: var(--muted); }
  footer a { color: var(--violet); font-weight: 600; text-decoration: none; }
  .hidden { display: none !important; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .enter > * { animation: rise 240ms var(--ease) both; }
  .enter > *:nth-child(2) { animation-delay: 35ms; }
  .enter > *:nth-child(3) { animation-delay: 70ms; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .check path { stroke-dashoffset: 0; }
    .ring { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#171335"/><path d="M27 37l10-10M24 31l-3 3a6 6 0 0 0 8.5 8.5l3-3M40 33l3-3a6 6 0 0 0-8.5-8.5l-3 3" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="square"/></svg>
      Connect
    </div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="en">English</option><option value="hi">हिन्दी</option><option value="kn">ಕನ್ನಡ</option><option value="ta">தமிழ்</option>
    </select>
  </header>

  <section id="v-loading" class="card"><p class="muted" data-t="loading"></p></section>

  <section id="v-missing" class="card done hidden">
    <h1 data-t="missingTitle"></h1>
    <p class="muted" data-t="missingBody"></p>
  </section>

  <section id="v-ended" class="card done hidden">
    <div class="check"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#16775B" stroke-width="2.5" stroke-linecap="square"/></svg></div>
    <h1 data-t="endedTitle"></h1>
    <p class="muted" data-t="endedBody"></p>
  </section>

  <section id="v-live" class="hidden">
    <div class="card">
      <p class="label" data-t="liveLabel"></p>
      <h1 id="car"></h1>
      <div class="status"><span class="dot" id="dot"></span><span id="updated"></span></div>
      <p class="muted" id="until" style="margin-top:4px"></p>

      <div class="sketch" id="sketch" role="img">
        <svg id="map" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <polyline class="route" id="route" points=""/>
          <circle class="start hidden" id="start" r="5"/>
          <circle class="ring hidden" id="ring" r="8"/>
          <circle class="here hidden" id="here" r="7"/>
        </svg>
        <div class="empty" id="waiting" data-t="waiting"></div>
      </div>

      <div class="figures">
        <div><p class="label" data-t="speed"></p><p class="figure" id="speed">—</p></div>
        <div><p class="label" data-t="distance"></p><p class="figure" id="distance">—</p></div>
      </div>

      <a class="btn hidden" id="maps" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span data-t="openMaps"></span>
      </a>
      <p class="muted" style="margin-top:12px" data-t="privacy"></p>
    </div>
  </section>

  <footer><span data-t="footer"></span> <a href="/get" data-t="getApp"></a></footer>
</main>

<script src="/config.js?v=2"></script>
<script>
(() => {
  const CFG = window.CONNECT_CONFIG || {};
  const POLL_MS = 15000;

  const STR = {
    en: {
      loading: "Loading…",
      missingTitle: "Trip not found", missingBody: "The link is incomplete or was never valid. Ask for a new one.",
      endedTitle: "This trip has ended", endedBody: "The driver stopped sharing, or the time they chose ran out. Their location is no longer shown.",
      liveLabel: "Live trip", waiting: "Waiting for the first location from their phone…",
      updated: "Updated {t}", stale: "Last seen {t}. Their phone may be offline.", until: "Sharing until {t}",
      now: "just now", sAgo: "{n} s ago", mAgo: "{n} min ago",
      speed: "Speed", distance: "Covered", openMaps: "Open in Google Maps",
      privacy: "Only people with this link can see it. It stops working when the trip ends.",
      footer: "Share your own drives for free.", getApp: "Get Connect",
    },
    hi: {
      loading: "लोड हो रहा है…",
      missingTitle: "ट्रिप नहीं मिली", missingBody: "लिंक अधूरा है या कभी मान्य नहीं था। नया लिंक माँगें।",
      endedTitle: "यह ट्रिप ख़त्म हो गई", endedBody: "ड्राइवर ने साझा करना बंद कर दिया, या चुना हुआ समय ख़त्म हो गया। उनकी लोकेशन अब नहीं दिखाई जाती।",
      liveLabel: "लाइव ट्रिप", waiting: "उनके फ़ोन से पहली लोकेशन का इंतज़ार…",
      updated: "{t} अपडेट हुआ", stale: "आख़िरी बार {t} दिखे। उनका फ़ोन ऑफ़लाइन हो सकता है।", until: "{t} तक साझा",
      now: "अभी", sAgo: "{n} सेकंड पहले", mAgo: "{n} मिनट पहले",
      speed: "रफ़्तार", distance: "तय दूरी", openMaps: "Google Maps में खोलें",
      privacy: "इसे सिर्फ़ इस लिंक वाले लोग देख सकते हैं। ट्रिप ख़त्म होने पर यह काम करना बंद कर देता है।",
      footer: "अपनी ड्राइव मुफ़्त में साझा करें।", getApp: "Connect पाएँ",
    },
    kn: {
      loading: "ಲೋಡ್ ಆಗುತ್ತಿದೆ…",
      missingTitle: "ಪ್ರಯಾಣ ಸಿಗಲಿಲ್ಲ", missingBody: "ಲಿಂಕ್ ಅಪೂರ್ಣವಾಗಿದೆ ಅಥವಾ ಮಾನ್ಯವಾಗಿರಲಿಲ್ಲ. ಹೊಸದನ್ನು ಕೇಳಿ.",
      endedTitle: "ಈ ಪ್ರಯಾಣ ಮುಗಿದಿದೆ", endedBody: "ಚಾಲಕರು ಹಂಚಿಕೆ ನಿಲ್ಲಿಸಿದ್ದಾರೆ, ಅಥವಾ ಆರಿಸಿದ ಸಮಯ ಮುಗಿದಿದೆ. ಅವರ ಲೊಕೇಶನ್ ಇನ್ನು ಕಾಣುವುದಿಲ್ಲ.",
      liveLabel: "ಲೈವ್ ಪ್ರಯಾಣ", waiting: "ಅವರ ಫೋನ್‌ನಿಂದ ಮೊದಲ ಲೊಕೇಶನ್‌ಗಾಗಿ ಕಾಯುತ್ತಿದೆ…",
      updated: "{t} ಅಪ್‌ಡೇಟ್ ಆಗಿದೆ", stale: "ಕೊನೆಯದಾಗಿ {t} ಕಂಡಿತು. ಅವರ ಫೋನ್ ಆಫ್‌ಲೈನ್ ಇರಬಹುದು.", until: "{t} ವರೆಗೆ ಹಂಚಲಾಗುತ್ತಿದೆ",
      now: "ಈಗಷ್ಟೇ", sAgo: "{n} ಸೆಕೆಂಡ್ ಹಿಂದೆ", mAgo: "{n} ನಿಮಿಷ ಹಿಂದೆ",
      speed: "ವೇಗ", distance: "ಕ್ರಮಿಸಿದ ದೂರ", openMaps: "Google Maps ನಲ್ಲಿ ತೆರೆಯಿರಿ",
      privacy: "ಈ ಲಿಂಕ್ ಇರುವವರು ಮಾತ್ರ ನೋಡಬಹುದು. ಪ್ರಯಾಣ ಮುಗಿದಾಗ ಇದು ಕೆಲಸ ನಿಲ್ಲಿಸುತ್ತದೆ.",
      footer: "ನಿಮ್ಮ ಪ್ರಯಾಣಗಳನ್ನು ಉಚಿತವಾಗಿ ಹಂಚಿಕೊಳ್ಳಿ.", getApp: "Connect ಪಡೆಯಿರಿ",
    },
    ta: {
      loading: "ஏற்றுகிறது…",
      missingTitle: "பயணம் கிடைக்கவில்லை", missingBody: "இணைப்பு முழுமையாக இல்லை அல்லது செல்லுபடியாகவில்லை. புதியதைக் கேளுங்கள்.",
      endedTitle: "இந்தப் பயணம் முடிந்தது", endedBody: "ஓட்டுநர் பகிர்வதை நிறுத்தினார், அல்லது தேர்ந்தெடுத்த நேரம் முடிந்தது. அவர்களின் இருப்பிடம் இனி காட்டப்படாது.",
      liveLabel: "நேரலைப் பயணம்", waiting: "அவர்களின் போனிலிருந்து முதல் இருப்பிடத்துக்காகக் காத்திருக்கிறது…",
      updated: "{t} புதுப்பிக்கப்பட்டது", stale: "கடைசியாக {t} தெரிந்தது. அவர்களின் போன் ஆஃப்லைனில் இருக்கலாம்.", until: "{t} வரை பகிரப்படுகிறது",
      now: "இப்போதுதான்", sAgo: "{n} வினாடி முன்", mAgo: "{n} நிமி முன்",
      speed: "வேகம்", distance: "கடந்த தூரம்", openMaps: "Google Maps இல் திற",
      privacy: "இந்த இணைப்பு உள்ளவர்கள் மட்டுமே பார்க்க முடியும். பயணம் முடிந்ததும் இது வேலை செய்யாது.",
      footer: "உங்கள் பயணங்களை இலவசமாகப் பகிருங்கள்.", getApp: "Connect பெறுங்கள்",
    },
  };
  const LANGS = Object.keys(STR);
  const LOCALE = { en: "en-IN", hi: "hi-IN", kn: "kn-IN", ta: "ta-IN" };

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const saved = store.get("dlc-lang");
  const browser = (navigator.language || "en").slice(0, 2);
  let lang = LANGS.includes(saved) ? saved : LANGS.includes(browser) ? browser : "en";
  const t = (k, args = {}) => (STR[lang][k] ?? STR.en[k] ?? k).replace(/\{(\w+)\}/g, (m, n) => (n in args ? args[n] : m));

  // The secret rides in the fragment, which browsers never send to a server.
  const token = (location.hash || "").slice(1).trim().toLowerCase();
  let last = null, timer = null, drawn = false;

  function applyLang() {
    document.documentElement.lang = lang;
    $("lang").value = lang;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
    if (last && !last.ended) renderLive(last);
  }

  function show(view) {
    ["v-loading", "v-missing", "v-ended", "v-live"].forEach((v) => {
      const el = $(v);
      const on = v === view;
      if (on && el.classList.contains("hidden")) {
        el.classList.remove("enter");
        void el.offsetWidth;
        el.classList.add("enter");
      }
      el.classList.toggle("hidden", !on);
    });
  }

  function ago(iso) {
    const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 10) return t("now");
    if (s < 60) return t("sAgo", { n: s });
    return t("mAgo", { n: Math.round(s / 60) });
  }

  function haversineKm(a, b) {
    const r = (d) => (d * Math.PI) / 180;
    const dLat = r(b[0] - a[0]), dLng = r(b[1] - a[1]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLng / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(h));
  }

  // Route sketch without map tiles: project the trail (equirectangular is
  // plenty at city scale) and fit it into the box with some padding.
  function drawRoute(points) {
    const pad = 36, W = 400, H = 300;
    const lat0 = points[points.length - 1][0] * Math.PI / 180;
    const xy = points.map(([la, lo]) => [lo * Math.cos(lat0), -la]);
    const xs = xy.map((p) => p[0]), ys = xy.map((p) => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const span = Math.max(maxX - minX, maxY - minY, 0.002);
    const scale = Math.min((W - 2 * pad) / span, (H - 2 * pad) / span);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const pts = xy.map(([x, y]) => [W / 2 + (x - cx) * scale, H / 2 + (y - cy) * scale]);
    const route = $("route");
    route.setAttribute("points", pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" "));
    // Draw the line in on first sight; later updates just extend it.
    if (!drawn && pts.length > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const len = route.getTotalLength();
      route.style.strokeDasharray = len;
      route.style.strokeDashoffset = len;
      route.getBoundingClientRect();
      route.style.transition = "stroke-dashoffset 900ms cubic-bezier(0.2, 0, 0, 1)";
      route.style.strokeDashoffset = "0";
      setTimeout(() => { route.style.strokeDasharray = ""; route.style.transition = ""; }, 950);
    }
    drawn = true;
    const [sx, sy] = pts[0], [hx, hy] = pts[pts.length - 1];
    for (const [id, x, y] of [["start", sx, sy], ["here", hx, hy], ["ring", hx, hy]]) {
      const c = $(id);
      c.setAttribute("cx", x.toFixed(1));
      c.setAttribute("cy", y.toFixed(1));
      c.classList.remove("hidden");
    }
    $("start").classList.toggle("hidden", pts.length < 2);
  }

  function renderLive(r) {
    $("car").textContent = r.car || t("liveLabel");
    const stale = !r.updated_at || Date.now() - new Date(r.updated_at).getTime() > 2 * 60_000;
    $("dot").classList.toggle("stale", stale);
    $("updated").textContent = r.updated_at ? t(stale ? "stale" : "updated", { t: ago(r.updated_at) }) : t("waiting");
    $("until").textContent = t("until", { t: new Date(r.ends_at).toLocaleTimeString(LOCALE[lang], { hour: "numeric", minute: "2-digit" }) });
    const has = r.lat != null && r.lng != null;
    $("waiting").classList.toggle("hidden", has);
    const trail = Array.isArray(r.trail) && r.trail.length ? r.trail : has ? [[r.lat, r.lng]] : [];
    if (has) {
      const pts = trail.length && trail[trail.length - 1][0] === r.lat && trail[trail.length - 1][1] === r.lng ? trail : [...trail, [r.lat, r.lng]];
      drawRoute(pts);
      const maps = $("maps");
      maps.href = `https://www.google.com/maps/search/?api=1&query=${r.lat.toFixed(6)},${r.lng.toFixed(6)}`;
      maps.classList.remove("hidden");
    }
    $("speed").innerHTML = "";
    $("speed").append(r.speed_mps == null ? "—" : String(Math.round(r.speed_mps * 3.6)));
    if (r.speed_mps != null) { const u = document.createElement("small"); u.textContent = "km/h"; $("speed").append(u); }
    let km = 0;
    for (let i = 1; i < trail.length; i++) km += haversineKm(trail[i - 1], trail[i]);
    $("distance").innerHTML = "";
    $("distance").append(trail.length > 1 ? km.toFixed(km < 10 ? 1 : 0) : "—");
    if (trail.length > 1) { const u = document.createElement("small"); u.textContent = "km"; $("distance").append(u); }
  }

  // A trip lives on whichever backend the sharer's app talks to: ask each in
  // turn until one knows the token, then stay on it.
  const BACKENDS = CFG.backends && CFG.backends.length ? CFG.backends : [{ supabaseUrl: CFG.supabaseUrl, anonKey: CFG.anonKey }];
  let active = null;

  async function ask(b) {
    const res = await fetch(`${b.supabaseUrl}/functions/v1/scan`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: b.anonKey || "" },
      body: JSON.stringify({ action: "trip", token }),
    });
    return { res, r: await res.json().catch(() => ({})) };
  }

  async function poll() {
    try {
      let got = null, down = false;
      for (const i of active !== null ? [active] : BACKENDS.keys()) {
        try {
          got = await ask(BACKENDS[i]);
        } catch { down = true; continue; }
        if (got.res.status !== 404 || active !== null) { active = i; break; }
      }
      if (!got) return; // no backend answered; keep the last view
      const { res, r } = got;
      if (res.status === 404 && !down) { stop(); return show("v-missing"); }
      if (res.status === 404) return; // a backend was unreachable: it may hold the trip
      if (!res.ok) return; // transient; the next tick retries
      last = r;
      if (r.ended) { stop(); return show("v-ended"); }
      renderLive(r);
      show("v-live");
    } catch { /* offline; keep the last view */ }
  }

  function stop() { clearInterval(timer); timer = null; }

  function init() {
    applyLang();
    $("lang").onchange = (e) => { lang = e.target.value; store.set("dlc-lang", lang); applyLang(); };
    if (!/^[0-9a-f]{36}$/.test(token)) return show("v-missing");
    poll();
    timer = setInterval(() => { if (!document.hidden) poll(); }, POLL_MS);
    // Keep "updated 12 s ago" honest between polls.
    setInterval(() => { if (last && !last.ended && !document.hidden) renderLive(last); }, 5000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && timer) poll(); });
  }

  init();
})();
</script>
</body>
</html>
